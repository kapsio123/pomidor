apiVersion: apps/v1
kind: Deployment
metadata:
  name: pomidor-app
  labels:
    app: pomidor-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pomidor-app
    template:
      metadata:
        labels:
          app: pomidor-app
      spec:
        containers:
          - name: pomidor-app
            image: pomidor-app:latest
            ports:
              - containerPort: 5000
            env:
              - name: APP_VERSION
                valueFrom:
                  configMapKeyRef:
                    name: pomidor-config
                    key: app_version
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "250m"
            readinessProbe:
              httpGet:
                path: /health
                port: 5000
              initialDelaySeconds: 10
              periodSeconds: 20

                